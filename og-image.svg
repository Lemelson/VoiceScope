  <text x="90" y="470" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="90" font-weight="700" fill="#e9ebee">Voice<tspan fill="#2fd0b5">Scope</tspan></text>
  <text x="93" y="540" font-family="Outfit, Helvetica, Arial, sans-serif" font-size="35" font-weight="500" fill="#96a0ab">Free online voice pitch analyzer</text>
