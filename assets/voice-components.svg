    <text x="72" y="126" fill="#eef1f3" font-size="40" font-weight="650">Pitch is measurable. Voice is multidimensional.</text>
    <g transform="translate(600 365)">
      <circle r="190" fill="#15191f" stroke="#293039"/>
      <circle r="105" fill="#18201e" stroke="#49c3ad"/>
