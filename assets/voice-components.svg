      <text x="0" y="30" fill="#eef1f3" font-size="30" font-weight="650" text-anchor="middle">VOICE</text>
      <g font-size="18" font-weight="650" text-anchor="middle">
        <text x="0" y="-151" fill="#49c3ad">F0 / PITCH</text>
